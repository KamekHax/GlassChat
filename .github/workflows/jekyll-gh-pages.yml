# Retained by repository owner choice; validation only, never deploys to GitHub Pages.
name: Manual validation (Jekyll workflow retained)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jekyll-validation
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the canonical static site
        working-directory: website
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CI: 'true'
        run: node scripts/build-site.mjs

      - name: Validate routes, metadata, CSP, legal links and release safety
        working-directory: website
        run: node scripts/check-site.mjs
